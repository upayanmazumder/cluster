apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: argocd-image-updater-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.sops.yaml
  # Noodle's write-back credential for the KIRRO repo, in its own file because that repo is a
  # different scope from this directory's other secrets (see that file's header).
  - ./noodle/secrets.sops.yaml
