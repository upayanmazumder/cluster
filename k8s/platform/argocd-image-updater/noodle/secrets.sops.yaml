#
# Noodle's write-back credential for the KIRRO repo.
#
# Why a third credential rather than reusing `git-creds-updater`: a deploy key is scoped to exactly
# one repository, and `git-creds-updater`'s key is a write deploy key on *this* repo only. The kirro
# Application sources its manifests from github.com/Cheetos-gif/kirro (a public repo owned by the
# team, not by this account), so image-updater needs its own identity there to commit the resolved
# digest back. Same mechanism, different scope — see docs/assets/noodle/README.md for the bot.
#
# The matching public key is a write deploy key on Cheetos-gif/kirro, titled `noodle`:
#   ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILsAhK+MXCwHooJDg3ZeLzy+hz0PLX0qXI1OEBCBTa3r noodle@upayan.dev
# (fingerprint SHA256:HvsfQtEznLP3AbKor0IV5PODmieSC/W7xLOG995YXMk). Installing it needs repo admin,
# which the cluster account does not have on that repo, so it is a one-time manual step.
#
# `insecure: "false"` keeps strict host-key verification on, same as `git-creds-updater`.
apiVersion: v1
kind: Secret
metadata:
    name: git-creds-noodle
    namespace: argocd
    annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
type: Opaque
stringData:
