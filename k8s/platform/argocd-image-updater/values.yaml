# ArgoCD Image Updater Helm chart values.
# Requires:
#   - Secret `argocd/git-creds`   (PAT with repo write access, for git write-back)
#
# Registry credentials: `pullsecret:argocd/ghcr-creds`, configured under `config.registries` below.
#
# **This header used to open "deliberately NONE" — directly contradicting the `credentials:` line
# 20 lines further down.** Both halves of the story were written and neither was deleted: the line
# was removed on 2026-09-28 because the PAT was dead (GitHub returned 401 on `GET /user` and 403 on
# `ghcr.io/token`, and a *rejected* credential is worse than none — it is sent on every request, so
# even public packages fail with `denied: denied`), and it was **restored later the same day** once
# the owner refreshed the token. The restoration is recorded beside the `credentials:` line; this
# paragraph was not updated with it.
#
# Kept, because it is the reasoning that matters if the token ever dies again: without credentials,
# anonymous pulls still work for 18 of the 23 configured images. The 5 private ones
# (`upayanmazumder/bitvault/bitvaultd`, `vitscopesoftwareteam/vcap-staging-backend/{api,auth,worker}`,
# `vitscopesoftwareteam/vcap-staging-frontend/web`) simply stop being tracked — they keep running,
# being digest-pinned and pulled via their own `pull-secret`s. So removing the line is the right
# response to a dead token, and restoring it is the right response to a live one.
# P6-02/P6-06: paused at 0 through the cutover (P6-02) and resumed here (P6-06).
# `replicaCount` is the chart's own key (verified against argo/argocd-image-updater 0.14.0).
# It was paused because it writes commits to a git repository, and during the source switch it would
# have been committing into the repository that is no longer the one being reconciled. The
# `git-repository` annotations now name `https://github.com/upayanmazumder/cluster`, and this file
# lives there too, so a resumed updater writes where ArgoCD reads.
replicaCount: 1

config:
  registries:
    - name: ghcr
      prefix: ghcr.io
      api_url: https://ghcr.io
      # Credential restored 2026-09-28: the owner refreshed the CLI token with `write:packages`
      # (read implied), and `argocd/ghcr-creds` now holds it, so the five private packages are
      # trackable again. Guarded by `pod-image-pull-failing` — and the class of failure this whole
      # episode belonged to is now backed up and alerted on either way (see docs/backups.md).
      credentials: pullsecret:argocd/ghcr-creds
      default: true
  logLevel: info
  disableKubeEvents: false
  # BOT-001 (2026-10-03): renamed from `argocd-image-updater
  # <image-updater@upayan.dev>`. The write-back bot is `noodle` now — its
  # `build: automatic update of <app>` commits are still the intended
  # write-back, only the author changed. GitHub maps the author avatar from the
  # `noodle-cluster` account that owns `noodle@upayan.dev`; the neutral default is `happy`
  # (docs/assets/noodle/README.md maps the rest).
  gitCommitUser: noodle
  gitCommitMail: noodle@upayan.dev
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 150m
    memory: 128Mi
