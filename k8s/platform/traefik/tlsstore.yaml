# S11/S7: make Traefik's default certificate explicit.
#
# Today the Cloudflare Origin CA wildcard reaches Traefik only by accident: the
# `monitoring/grafana-tls` Secret happens to contain the wildcard, Traefik loads
# it because that Ingress resolves, and it then serves the wildcard by SNI match
# for every other `*.upayan.dev` host -- including hosts whose Ingresses
# reference a per-app Secret that does not exist in their namespace (status-page
# and upayan-web log "secret <ns>/<name>-tls does not exist" on every reconcile).
#
# A TLSStore named `default` in the same namespace as Traefik is the supported
# way to state this deliberately. The Secret it points at is the same
# certificate that is being served right now, byte for byte (verified), so this
# changes no behaviour -- it removes the dependency on two unrelated Secrets.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-upayan-dev-tls
