apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # This is the cluster's ONLY HelmChartConfig/traefik (two would collide on name), so every Traefik
    # setting lives here.
    ports:
      # N7: the VCAP Postgres edge. These replace `postgres-dev`(5432)/`postgres-staging`(5433),
      # which are closed permanently (OD-1) — nothing serves them, and Traefik no longer even
      # listens on them.
      #
      # The listeners exist here, but **nothing outside can reach them**: the Hetzner firewall has
      # no rule for 15432/15433. They open only once P2-08 has landed and VCAP has accepted the
      # pg_hba / non-superuser-app-role change (the plan's N7 gate) — until then this is the
      # cluster half, deliberately inert from the internet, and an in-cluster connection over
      # 15432 adds TLS rather than removing any control.
      vcap-pg-dev:
        port: 15432
        expose:
          default: true
        exposedPort: 15432
        protocol: TCP
      vcap-pg-staging:
        port: 15433
        expose:
          default: true
        exposedPort: 15433
        protocol: TCP
      # V1-CUTOVER (2026-10-03): v1's public Postgres edge. Its own port so
      # v2's 15432/15433 stay exactly as they are for v2's return, and its own
      # SNI (`pg-v1.upayan.dev`) so it can carry its own certificate instead of
      # needing v2's. The firewall rule that makes it reachable from the
      # internet is in terraform/firewall.tf and registered in
      # inventory/ports.yaml; without that rule this listener is cluster-only,
      # exactly like the other two were before theirs were added.
      vcap-pg-v1:
        port: 15434
        expose:
          default: true
        exposedPort: 15434
        protocol: TCP
      metrics:
        port: 9100
        expose:
          # In the Service so Prometheus can scrape it in-cluster. Not reachable from the
          # internet: the firewall's only world-open tcp rules are 22, 6443 and the two Postgres
          # ports, and 80/443 are restricted to Cloudflare's ranges (N4). UDP 41641 is Tailscale
          # and icmp is answered.
          default: true
        exposedPort: 9100
        protocol: TCP
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
