apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The `policy-controller` namespace and its Pod Security labels. The Helm chart (values.yaml next
# to this file) renders everything else; this source exists only so the namespace comes from the
# shared baseline component like every other namespace in this repo instead of from
# `CreateNamespace=true`, which would leave it without Pod Security labels.
namespace: policy-controller
components:
  - ../../components/namespace-baseline
