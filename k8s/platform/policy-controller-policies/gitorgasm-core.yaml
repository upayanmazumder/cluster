# Verify a signed image-publication attestation for the exact gitorgasm core repository.
# Controller v0.15.1 does not implement bundle image-signature verification; an attestation
# selects its supported cryptographic bundle path. See ADR 0010 and the failed first smoke.
#
# Stay warn/Ignore until live signed/unsigned/wrong-identity admission smoke succeeds.
# Promotion must pair mode: enforce with webhook.failurePolicy: Fail in values.yaml.
# Rollback restores both warn and Ignore. Admission scope remains gitorgasm namespace only.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: gitorgasm-core-signed
spec:
  mode: warn
  images:
    # Match this exact repository, not core-other or core/nested. The validator receives the
    # normalized digest reference; tag form also covers workload admission before resolution.
    - glob: "ghcr.io/upayanmazumder/gitorgasm/core@sha256:*"
    - glob: "ghcr.io/upayanmazumder/gitorgasm/core:*"
  authorities:
    - name: github-actions-image-publish
      signatureFormat: bundle
      keyless:
        # Public-good Sigstore instance. Fulcio and Rekor trust roots reach the webhook through
        # TUF (tuf-repo-cdn.sigstore.dev), not through these URLs.
        url: https://fulcio.sigstore.dev
        identities:
          # Fulcio puts `https://github.com/<job_workflow_ref>` in the certificate SAN. For a job
          # in a reusable workflow, `job_workflow_ref` is the REUSABLE workflow's file, here
          # image-publish.yml (called from ci.yml), not the calling ci.yml. The environment name
          # (`image-publish`) appears in the OIDC `sub` claim only, not in the SAN. Exact match,
          # no regexp: another workflow or branch in the same repository does not qualify.
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/upayanmazumder/gitorgasm/.github/workflows/image-publish.yml@refs/heads/main
      ctlog:
        url: https://rekor.sigstore.dev
      attestations:
        - name: image-publication
          predicateType: https://gitorgasm.upayan.dev/attestations/image-publish/v1
          policy:
            type: cue
            data: |
              predicate: {
                repository: "upayanmazumder/gitorgasm"
                ref: "refs/heads/main"
              }
