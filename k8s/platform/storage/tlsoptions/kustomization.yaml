apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately no `namespace:` — each manifest carries its own, because this lives under an
# Application whose destination has none (see ../kustomization.yaml).
resources:
  # v1's namespace needs its own copy. A TLSOption is namespaced and an
  # IngressRouteTCP can only reference one in its own namespace.
  - vcap-pg-v1.yaml
