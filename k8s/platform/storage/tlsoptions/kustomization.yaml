apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately no `namespace:` — each manifest carries its own, because this lives under an
# Application whose destination has none (see ../kustomization.yaml).
resources:
  - vcap-pg-dev.yaml
  - vcap-pg-staging.yaml
  # V1-CUTOVER (2026-10-03): v1's own namespace needs its own copy — a
  # TLSOption is namespaced and an IngressRouteTCP can only reference one in its
  # own namespace.
  - vcap-pg-v1.yaml
