# Tenant namespaces the cluster owns (VCAP-007's namespace half).
#
# Until now these two namespaces were created as a side effect of the VCAP
# Applications (`syncOptions: CreateNamespace=true`) and were owned by no
# manifest at all: nothing declared them, nothing tracked them, and only
# `managedNamespaceMetadata` put a label on them. That is fine for creation and
# alarming for deletion — an app whose namespace it created is not a good
# custodian of the data inside it.
#
# Declaring them here moves that custody to the `storage` Application, which
# already owns the class-A static PVs on the same volume (`/srv/data`). Two
# deliberate choices:
#
#   - `Delete=false,Prune=false`: this repo must not be able to delete a
#     namespace holding vcap-staging's class A data because a directory was
#     removed from git or a project temporarily stopped rendering it.
#   - Pod Security `enforce: baseline` (owner decision OD/VCAP-007, measured
#     safe by a server-side dry-run on 2026-09-28: no violation for any current
#     VCAP workload). `warn: restricted` is kept so new work that would need
#     privilege reports itself instead of failing silently later.
#
# The Applications' `CreateNamespace=true` and `managedNamespaceMetadata` are
# removed in the same commit: two owners for one object is how a namespace
# picks up a field nobody meant to set.
apiVersion: v1
kind: Namespace
metadata:
  name: vcap-dev
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: vcap-staging
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
# V1-CUTOVER (2026-10-03): v1 (devlabs forks of vcap-backend-v1/vcap-frontend-v1)
# deployed alongside vcap-staging/vcap-dev while v2 is paused (see
# k8s/argocd/applications/vcap/*.yaml). Separate namespace, not a reuse of
# vcap-staging, so v1's Secrets/PVCs/NetworkPolicy can never collide with or
# accidentally select v2's — v2's data stays exactly as it was. `baseline`
# (not `restricted`) because the backend container's entrypoint starts as
# root to chown its PVC mounts before dropping to `gosu appuser` — the same
# CHOWN/SETUID/SETGID/DAC_OVERRIDE need as adhigrahan-radar's nginx, above.
apiVersion: v1
kind: Namespace
metadata:
  name: vcap-v1
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
# P3-M4 (OD-4): the same boundary for the replacement application, now on the `radar.upayan.dev`
# hostnames (renamed 2026-09-30 from `meghmitra`/`meghmitra.upayan.dev`; the previous `meghmitra`
# Namespace object is left live and unmanaged here on purpose - Delete=false,Prune=false protects
# it from a prune either way, and its retirement is a separate, deliberate follow-up).
#
# It arrived here late on purpose, originally. Until P3-M4 the namespace was created by the
# *legacy* Application (`CreateNamespace=true`) and tracked by it, so declaring it here as well
# would have meant two Applications rendering one Namespace — and the legacy app's `prune: true`
# would have been free to delete it the moment the new spec stopped listing it. The switch and this
# declaration shipped in one commit, and the live object was additionally annotated
# `Delete=false,Prune=false` by hand before the switch, so no ordering of the two syncs could
# remove it.
#
# `enforce: baseline` is already what the live namespace carries (the legacy app set it via
# `managedNamespaceMetadata`), so this changes no running pod: it moves the label to a manifest that
# states it. Note the web container deliberately relies on it — nginx's master needs CHOWN/SETGID/
# SETUID/DAC_OVERRIDE to drop its workers, which `baseline` admits and `restricted` does not.
apiVersion: v1
kind: Namespace
metadata:
  name: adhigrahan-radar
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
