apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority
value: -1
globalDefault: false
description: >-
  Low-importance apps (D-3, 2026-09-28): cas-api, dj-html-nodejs-web, kodesphere,
  learning-docker/qwik/react, meghmitra's stateless tiers (api + web — NOT its postgres, which backs
  them, holds class A data and must not be preempted), mochi, smart-home-system-api.
  Scheduled below the implicit default (0) so the scheduler and kubelet node-pressure eviction reclaim
  these first, ahead of the always-on set (argocd, monitoring, status-page, vcap).
  Rewritten 2026-09-28: the previous text began mid-list with a stray ")" and still listed cheatsheet,
  decommissioned earlier the same day. It names `meghmitra` as a whole, but only its api/web Deployments
  are demoted — see k8s/apps/meghmitra/api.yaml for why the database stays at the default priority.
