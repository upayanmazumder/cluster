apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: argocd-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.sops.yaml
  # V1-CUTOVER (2026-10-03): the DevLabs forks' repository credential. v1's
  # Applications chart from upayanmazumder-DevLabs/*, which are private and
  # which ArgoCD had no credential for — the two per-repo Secrets below this
  # dir's other file cover only vitscopesoftwareteam. One `repo-creds` entry
