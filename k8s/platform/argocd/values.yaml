# ArgoCD Helm chart values — self-managed by the `argocd` Application.
# Traefik terminates TLS externally, so ArgoCD server runs in insecure mode.
# Run `argocd app diff argocd` before first sync.
#
# IMG-005: chart 10.10.5 (app v3.5.5, upgraded from 7.9.1/v2.14.11) flips the
# chart's own default to `global.networkPolicy.create: true`, which would add
# 5 duplicate NetworkPolicy objects under different names alongside the ones
# this repo already manages explicitly (see
# k8s/platform/argocd/network-policies/manifests.yaml, S11). That file's
# repo-server policy intentionally allows more than the chart's own template
# would, so the chart's version is not a safe substitute. Pinned back to the
# pre-upgrade behavior.
global:
  networkPolicy:
    create: false
configs:
  params:
    server.insecure: "true"
    # P3-02: the ApplicationSet controller updates the Applications it generates and never deletes
    # them. The default policy (`sync`) removes an Application as soon as its list element is gone —
    # and with `preserveResourcesOnDeletion: true` on the set, deletion is not what removes the
    # workloads, it just strands them. `create-update` makes "this app left the list" a thing that
    # has to be done deliberately rather than a side effect of editing a YAML list.
    #
    # Scope note: this controller only ever touches `Application` objects. The Applications it
    # generates have no `resources-finalizer`, so even a delete could not cascade into a namespace.
    applicationsetcontroller.policy: create-update
  # Required for KSOPS: kustomize refuses exec/alpha generator plugins otherwise.
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    # The argo-cd chart defaults this to the placeholder
    # https://argocd.example.com, which is what the live argocd-cm had --
    # wrong links in the UI, the CLI and any future OAuth redirect. Found
    # 2026-09-28 during the S11 hardening pass.
    url: https://argocd.upayan.dev
    # UI theme (owner request, 2026-09-29): https://github.com/MatterAIOrg/argocd-gravity-theme
    #
    # Loaded from jsDelivr rather than vendored into this repository, for a licensing reason
    # rather than a technical one: the theme ships **no license**, and this repository is heading
    # public (P8-04) — copying an unlicensed stylesheet into it creates an obligation nobody
    # agreed to, for a file we can reference for free. The fork's stylesheet is byte-identical to
    # the original author's (same blob hash), so either URL serves the same theme.
    #
    # Pinned to a **commit**, not `@main`: a branch ref would let the ArgoCD UI change without a
    # commit here, which is the wrong shape for something an operator looks at.
    #
    # Trade-off, stated plainly: the UI now fetches one stylesheet from a third-party CDN. If that
    # CDN is unreachable the UI renders **unthemed** — ArgoCD's own styles are untouched, so this
    # degrades to the default look rather than to a broken page. Self-hosting needs a license or
    # the author's written permission first.
    #
    # The theme is designed for ArgoCD's dark mode: the dark/light choice is a *user* preference
    # in the UI, not a server setting, so the owner toggles it once per browser.
    ui.cssurl: https://cdn.jsdelivr.net/gh/MatterAIOrg/argocd-gravity-theme@8f821c569ce5d69bb7829bbc1f09daa56702b1a5/argo-theme.css
  secret:
    # S11: argocd-secret is now owned by k8s/platform/argocd/secret (SOPS via
    # ksops) rather than generated by the chart, so the admin password hash and
    # server.secretkey are in git and survive an etcd loss. The values were
    # copied byte-for-byte from the live Secret, so the password is unchanged --
    # verified by comparing key fingerprints before and after the switch. One
    # owner: the chart must not also create it.
    createSecret: false
redis:
  serviceAccount:
    create: true
    automountServiceAccountToken: true
    name: argocd-redis
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 96Mi

# No component had resource requests/limits before — an unbounded controller
# (the heaviest component; does all git diff/sync work) could consume the
# whole node. Pin to observed usage + headroom.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
  # Expose the UI/API at https://argocd.upayan.dev via Traefik. No ingress existed
  # before, so the dashboard was unreachable even though every component was healthy.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      # N3 (P7): `websecure` only. The `web` entrypoint was removed because it could never match
      # anyway: with `router.tls: "true"` below, Traefik only builds a TLS router, so a plaintext
      # request on port 80 gets 404 even though `web` was declared. Measured before the change
      # (2026-09-29, direct to the origin with the right Host header): `HTTP/1.1 404 Not Found` on :80
      # for both this host and grafana. So this edit changes no behaviour — it removes a declaration
      # that contradicted `tls: "true"` and would become a live plaintext path only if someone later
      # set `tls: false`, at which point Cloudflare Access (which guards this hostname at the edge
      # over HTTPS) would be bypassable by a request straight to the origin. Access itself was
      # verified live after the apply: https://argocd.upayan.dev 302s to the Access login.
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hostname: argocd.upayan.dev
    # No `tls:` block: Traefik terminates with its default certificate, the
    # Cloudflare Origin CA wildcard from the TLSStore in k8s/platform/traefik/,
    # whose SAN covers *.upayan.dev. This removes argocd's dependency on
    # cert-manager -- its previous cert was a Let's Encrypt one that had to
    # renew (valid to 2026-11-22), with a renewal-failure mode that a 15-year
    # Origin CA certificate does not have. Every host this cluster serves is
    # Cloudflare-proxied, so an Origin CA cert is valid for all of them.
    tls: false
  # (No `certificate:` block: it existed only to have cert-manager issue a
  # Certificate for this host. The ingress above takes the default certificate.)
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  # KSOPS (kustomize-sops) + age integration — lets the repo-server decrypt
  # k8s/**/secrets.sops.yaml at build time via the `age-cluster` private key
  # (bootstrapped once as the `argocd/sops-age` Secret, never committed — see
  # docs/secrets.md). Real, verified image digest for viaductoss/ksops:v4.5.1:
  # sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334.
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /.config/sops/age
      name: sops-age
  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
dex:
  # S11: removed. dex is running with no connectors -- `argocd-cm` has no
  # `dex.config`, so SSO cannot possibly work, and login is the local
  # `admin` account (`admin.enabled: true`). It was an extra Deployment,
  # Service, ServiceAccount and NetworkPolicy listening on 5556 for nothing.
  # The chart default keeps it on; turning it off also drops
  # `server.dex.server` from argocd-cmd-params-cm.
  enabled: false
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
notifications:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 96Mi
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
