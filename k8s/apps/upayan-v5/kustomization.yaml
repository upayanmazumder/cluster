apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: upayan-v5
resources:
  - networkpolicy.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/ingress.yaml
components:
  # CLUSTER-001: shared namespace + PSA labels; the per-app namespace.yaml this replaces was
  # byte-identical apart from its `name:`, which the kustomization's `namespace:` now supplies.
  - ../../components/namespace-baseline

generators:
  # SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
  - secret-generator.yaml
images:
  # The website moved to Vercel (upayan.dev); only the Rust stats API runs here.
  # argocd-image-updater pins the `latest` digest published from upayan.dev `main`.
  - name: ghcr.io/upayanmazumder/upayan.dev/api
    newTag: latest
