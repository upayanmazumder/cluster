# S11 hardening: default-deny ingress. The website runs on Vercel, so the only
# legitimate source is Traefik, which routes api.upayan.dev to the API on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-v5-default-deny-ingress
  namespace: upayan-v5
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-v5-api
  namespace: upayan-v5
spec:
  podSelector:
    matchLabels:
      app: upayan-v5-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
