apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-api-default-deny-ingress
  namespace: upayan-api
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upayan-api-ingress
  namespace: upayan-api
spec:
  podSelector:
    matchLabels:
      app: upayan-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
