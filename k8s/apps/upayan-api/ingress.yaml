apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: upayan-api
  namespace: upayan-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api.upayan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: upayan-api
                port:
                  number: 8080
