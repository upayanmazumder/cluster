# Cloudflare proxies api-gitorgasm.upayan.dev to Traefik. Traefik terminates TLS with the
# Cloudflare Origin CA wildcard, so this Ingress has no tls block (cluster convention).
# The DNS record does not exist yet. Creating it needs explicit owner approval.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: api-gitorgasm.upayan.dev
      http:
        paths:
          # Only the public API and the webhook receiver. Health endpoints stay internal.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  name: http
