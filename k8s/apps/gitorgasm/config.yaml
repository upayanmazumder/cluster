apiVersion: v1
kind: ConfigMap
metadata:
  name: gitorgasm-core
data:
  GITORGASM_ENV: production
  HTTP_ADDR: ':8080'
  METRICS_ADDR: ':9090'
  COOKIE_SECURE: 'true'
  SESSION_TTL: 168h
  WORKER_CONCURRENCY: '4'
  RECONCILE_INTERVAL: 6h
  DB_MAX_CONNS: '8'
  SHUTDOWN_TIMEOUT: 25s
  # Overlays set APP_ORIGIN and GITHUB_OAUTH_CALLBACK_URL.
  APP_ORIGIN: https://gitorgasm.example.invalid
