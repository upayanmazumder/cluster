# Bind the data claim to the static Retain PV on /srv/data (backed up by restic).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: ''
        volumeName: gitorgasm-postgres-vps
        resources:
          requests:
            storage: 2Gi
