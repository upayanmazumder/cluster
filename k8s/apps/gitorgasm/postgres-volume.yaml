# Bind the data claim to the static Retain PV on /srv/data (backed up by restic).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    # apiVersion, kind, and volumeMode match the server defaults, so Argo CD sees no drift.
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        volumeMode: Filesystem
        storageClassName: ''
        volumeName: gitorgasm-postgres-vps
        resources:
          requests:
            storage: 2Gi
