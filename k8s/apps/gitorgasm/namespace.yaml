apiVersion: v1
kind: Namespace
metadata:
  name: gitorgasm
  annotations:
    # Never let a GitOps mistake delete the namespace that holds the database.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    # Every Gitorgasm pod is non-root, drops all capabilities, and uses RuntimeDefault seccomp,
    # so the namespace enforces the restricted profile, not only warns.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
