apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Migrations run before the new version serves traffic. goose and River take advisory
      # locks, so overlapping pods during a rollout cannot apply a migration twice.
      # Migrations must be backward compatible with the previous release (expand/contract).
      initContainers:
        - name: migrate
          image: ghcr.io/upayanmazumder/gitorgasm/core
          args: ['migrate']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gitorgasm-core
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      containers:
        - name: api
          image: ghcr.io/upayanmazumder/gitorgasm/core
          args: ['api']
          envFrom:
            - configMapRef:
                name: gitorgasm-core
            - secretRef:
                name: gitorgasm-core
          env:
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext: *containerSecurity
