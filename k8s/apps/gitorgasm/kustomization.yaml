apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Gitorgasm (https://github.com/upayanmazumder/gitorgasm). Source of these manifests:
# deploy/kustomize/{base,overlays/production} in that repository, copied here because the
# `apps` AppProject only allows this repository as a source. Keep both in step.
#
# Not using ../../components/namespace-baseline on purpose: every Gitorgasm pod is non-root with
# all capabilities dropped, so namespace.yaml enforces Pod Security `restricted`, not `baseline`.
namespace: gitorgasm
labels:
  - pairs:
      app.kubernetes.io/part-of: gitorgasm
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - networkpolicies.yaml
  - ingress.yaml
  - persistentvolume.yaml
patches:
  - path: pin-node.yaml
    target:
      kind: Deployment
  - path: pin-node.yaml
    target:
      kind: StatefulSet
  - path: postgres-volume.yaml
  - path: config-production.yaml
generators:
  # SOPS-encrypted via ksops: Secrets gitorgasm-core and gitorgasm-postgres.
  - secret-generator.yaml
images:
  - name: ghcr.io/upayanmazumder/gitorgasm/core
    newTag: latest
