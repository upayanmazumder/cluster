apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # River stops fetching on SIGTERM and waits for running jobs up to SHUTDOWN_TIMEOUT.
      # Jobs still running after that are retried by another worker after rescue.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/upayanmazumder/gitorgasm/core
          args: ['worker']
          envFrom:
            - configMapRef:
                name: gitorgasm-core
            - secretRef:
                name: gitorgasm-core
          env:
            - name: GOMEMLIMIT
              value: 200MiB
            # Two queues need 2 x WORKER_CONCURRENCY connections. Scoring needs 1. River needs 4.
            - name: DB_MAX_CONNS
              value: '13'
          ports:
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
