apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  # ksops decrypts secrets.sops.yaml with the age key ArgoCD's repo-server
  # holds (argocd/sops-age) and emits the Secrets below. ArgoCD reads them
  # because this directory is a source of the vcap-backend-v1 Application.
  # The retired v2 Secrets used the same pattern.
  name: vcap-v1-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.sops.yaml
