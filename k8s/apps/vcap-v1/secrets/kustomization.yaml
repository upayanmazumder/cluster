# The v1 backend Secrets (backend-env, auth-env) and the GHCR pull-secret for
# the (private) upayanmazumder-devlabs/vcap-backend-v1{,-auth} and
# vcap-frontend-v1 image packages. The retired v2 directories
# k8s/apps/vcap/secrets/{dev,staging} used the same shape. This is a separate
# ArgoCD source because a Helm-sourced chart and a ksops generator cannot share
# one kustomize build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
generators:
  - secret-generator.yaml
