# The v1 backend Secrets (backend-env, auth-env) and the GHCR pull-secret for
# the (private) upayanmazumder-devlabs/vcap-backend-v1{,-auth} and
# vcap-frontend-v1 image packages. Same shape as
# k8s/apps/vcap/secrets/{dev,staging} — see that directory's kustomization.yaml
# for why this is a separate ArgoCD source rather than a chart value.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
generators:
  - secret-generator.yaml
