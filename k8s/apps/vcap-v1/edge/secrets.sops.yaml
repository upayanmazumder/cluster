# V1-CUTOVER (2026-10-03): the public Postgres edge TLS material for v1.
#
# SELF-SIGNED, deliberately, and this is the one place v1's edge differs from
# v2's: v2's leaf is signed by the cluster's `VCAP Postgres edge CA`, whose
# **key is deliberately not in this repository** ("it is what signs a
# replacement leaf", docs/runbooks/vcap-postgres-access.md) and is not in the
# cluster either — so no new leaf can be minted under it. Rather than bypass
# that boundary, v1's edge carries its own CA. The CA certificate below is
# public and reproduced in docs/runbooks/vcap-v1-postgres-access.md; the CA key
# is not here, was generated on the workstation for this one signing operation
# and is held by the owner like the cluster CA's.
#
# SANs are `pg-v1.upayan.dev` (the name a client puts in `host=`, which is what
# becomes the TLS SNI and selects this certificate via the route's secretName)
# and `IP:138.201.157.147` (what it puts in `hostaddr=`, so no DNS record is
# needed — a hand-written record would break this repo's adopt-from-live-zone
# rule).
#
# `tls.crt` carries the leaf **and** the CA, so a client holding only the CA
# file still verifies.
