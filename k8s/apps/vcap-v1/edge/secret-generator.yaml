apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  # ksops decrypts secrets.sops.yaml with the age key ArgoCD's repo-server holds
  # (argocd/sops-age) and emits the TLS Secret the IngressRouteTCP references.
  name: vcap-v1-edge-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.sops.yaml
