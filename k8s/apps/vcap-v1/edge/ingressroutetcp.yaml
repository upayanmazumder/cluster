# V1-CUTOVER (2026-10-03): the public Postgres edge for v1.
#
# Same design as v2's (`k8s/apps/vcap/edge/staging/ingressroutetcp.yaml`) —
# entrypoint + HostSNI + TLS selected by secretName — on its own port so v2's
# 15432/15433 stay exactly as they are for v2's return.
#
# Why `HostSNI` names a hostname rather than `*`: a client connecting *by IP*
# sends no SNI, and Traefik then serves its default certificate (the cluster's
# `*.upayan.dev` wildcard), which does not chain to this edge's CA. Naming the
# SNI lets Traefik select this route's own certificate, with no default
# certificate changed. Clients pass `host=pg-v1.upayan.dev` (for SNI and
# certificate verification) together with `hostaddr=138.201.157.147` (to
# dial by IP — the name intentionally has no DNS record).
#
# `Prune=false`: removing this file from git must never silently close the
# edge — that is a routing change, and it belongs in a reviewed commit with an
# intent comment, not in a prune sweep.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: vcap-v1-postgres
  namespace: vcap-v1
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  entryPoints:
    - vcap-pg-v1
  routes:
    - match: HostSNI(`pg-v1.upayan.dev`)
      services:
        - name: vcap-backend-v1-postgres
          port: 5432
  tls:
    # Leaf signed by this edge's own CA (self-signed — see secrets.sops.yaml
    # for why). Traefik selects it because the SAN matches the SNI above.
    secretName: vcap-v1-postgres-edge-tls
    # …and the ALPN name libpq 17+ offers, which Traefik otherwise answers with
    # alert 120 — see the TLSOption in k8s/platform/storage/tlsoptions/.
    options:
      name: vcap-pg
