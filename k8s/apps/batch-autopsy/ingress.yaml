apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: batch-autopsy
  namespace: batch-autopsy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  # Cloudflare proxies both hosts. Traefik uses the existing wildcard Origin CA certificate.
  rules:
    - host: batch-autopsy.upayan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    - host: api-batch-autopsy.upayan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
