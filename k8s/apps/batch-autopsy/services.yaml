apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: batch-autopsy
spec:
  type: ClusterIP
  selector:
    app: batch-autopsy-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: batch-autopsy
spec:
  type: ClusterIP
  selector:
    app: batch-autopsy-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: batch-autopsy
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: batch-autopsy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
