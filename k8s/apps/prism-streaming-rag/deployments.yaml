apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-streaming-rag
  labels:
    app: prism-streaming-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prism-streaming-rag
  template:
    metadata:
      labels:
        app: prism-streaming-rag
    spec:
      # D-3: best-effort app, reclaimed first under node pressure.
      priorityClassName: low-priority
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - vps
      containers:
        - name: prism-streaming-rag
          image: ghcr.io/cheetos-gif/prism-streaming-rag:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # `groq` writes the answer prose with Llama 3.3 70B instead of extracting sentences from
            # the retrieved chunks; the key is in the SOPS-encrypted Secret mounted below.
            - name: MODEL_PROVIDER
              value: groq
            - name: GROQ_MODEL
              value: llama-3.3-70b-versatile
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            # The image ships the sentence-transformers model, so no runtime download.
          envFrom:
            - secretRef:
                name: prism-streaming-rag-env
          # Startup loads torch and the embedding model, then builds the corpus index
          # (controller/main.py lifespan) before uvicorn accepts connections: ~11s on the
          # workstation, and the image bakes the model in. The first readiness probe fails with
          # "connection refused" for that reason and passes on a later attempt. Measured in this
          # cluster: 422Mi resident while serving, so requests 512Mi and limits 1Gi.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
