# S11 hardening: default-deny ingress. The only Ingress in this namespace
# routes prism.upayan.dev to the `prism-streaming-rag` Service on 8000, so
# Traefik is the only legitimate source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prism-streaming-rag-default-deny-ingress
  namespace: prism-streaming-rag
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prism-streaming-rag-ingress
  namespace: prism-streaming-rag
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
