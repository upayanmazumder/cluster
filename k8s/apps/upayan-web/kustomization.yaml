apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: upayan-web
# Decommission, phase 1 of 2 (2026-10-14): the v4 Node API that served api.upayan.dev is replaced
# by the Rust API in `upayan-v5`. Removing the Deployment, Service, and Ingress here lets
# this Application's automated prune delete them (the ApplicationSet preserves resources when an
# Application itself is deleted, so pruning has to happen before the registration goes).
# Phase 2 (2026-10-14) pruned Secret `upayan-web-env`. Phase 3 removes this folder, the ApplicationSet
# element, and the project namespace.
resources:
  - networkpolicy.yaml
components:
  - ../../components/namespace-baseline
