# The kirro voice channel's credentials (ADR-017 in the app repo).
#
# Why a separate source instead of the app's own kustomization: kirro's manifests live in
# github.com/Cheetos-gif/kirro, which is **public**, so its Secret cannot be committed there. This
# directory is a second source of the same `kirro` Application, in this private repo, SOPS-encrypted
# through ksops — the same shape the vcap Secrets use (SEC-003), and for the same reason: a source
# that is not the app's own kustomize directory can still run a ksops generator.
#
# Secret name `kirro-voice` is what the kirro repo's k8s/deployments.yaml references by
# secretKeyRef, so nothing in the app repo changes when this lands.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kirro
# SOPS-encrypted via ksops (kind: ksops) -- see secrets.sops.yaml
generators:
  - secret-generator.yaml
