apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  # ksops decrypts secrets.sops.yaml with the age key ArgoCD's repo-server holds (argocd/sops-age)
  # and emits the Secret below. ArgoCD reads it because this directory is a source of the `kirro`
  # Application (k8s/argocd/applications/apps/kirro.yaml).
  name: kirro-secrets-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.sops.yaml
