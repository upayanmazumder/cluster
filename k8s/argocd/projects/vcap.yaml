apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: vcap
  namespace: argocd
spec:
  description: >-
    vcap v1 — charts in the DevLabs forks; one ArgoCD Application per service.
  sourceRepos:
    - https://github.com/upayanmazumder/cluster
    # V1-CUTOVER (2026-10-03): v1's charts live in the DevLabs forks, not the
    # scopeapp2026 repos the v2 charts come from. Added deliberately and
    # narrowly — the two forks only, not a wildcard.
    - https://github.com/upayanmazumder-DevLabs/vcap-backend-v1
    - https://github.com/upayanmazumder-DevLabs/vcap-frontend-v1
  # S11: destinations enumerated instead of `namespace: "*"`. Adding an app
  # means adding its namespace here too; a mismatch fails loudly ("namespace
  # X is not permitted in project vcap") rather than deploying anywhere.
  destinations:
    # V1-CUTOVER (2026-10-03): v1 is the only active vcap environment. The
    # v2 namespaces keep their PVCs and data, but no Application deploys there.
    - server: https://kubernetes.default.svc
      namespace: vcap-v1
  # ESC-001 / VCAP-002 (2026-09-29): this project granted `Namespace`,
  # `ClusterRole`, `ClusterRoleBinding` and all of `keda.sh/*` at cluster
  # scope, and every namespaced kind via `group: "*" / kind: "*"`. Together
  # with an unprotected tenant `main`, that meant a push to a tenant chart
  # could create a ClusterRoleBinding to `cluster-admin` — proven with a
  # throwaway Application on 2026-09-29. The tenant is a tenant: it deploys
  # workloads into one namespace and nothing else.
  #
  # Empty, deliberately. Nothing in `vcap-v1` is cluster-scoped: the namespace
  # is declared by the `storage` Application, its static PV by the same one,
  # and the public Postgres edge is cluster-owned.
  clusterResourceWhitelist: []
  # Exactly what the chart, `frontend-manifests`, `secrets/` and `edge/`
  # render, taken from each app's live `status.resources` on 2026-09-29.
  # Anything new fails as "not permitted in project vcap" — the review gate.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: keda.sh
      kind: ScaledObject
    - group: keda.sh
      kind: TriggerAuthentication
    # The cluster-owned public Postgres edge (k8s/apps/vcap-v1/edge).
    # IngressRouteTCP only: Middleware, IngressRoute, TLSOption, ServersTransport
    # and MiddlewareTCP stay denied — the tenant has no reason to touch routing.
    #
    # A `TLSOption` *is* needed for the edge (it is what accepts the ALPN name libpq 17+ offers),
    # but it is **cluster-owned and lives in `k8s/platform/storage/tlsoptions/`**, applied by the
    # `storage` Application into these namespaces. The tenant references it by name and cannot
    # create or change it — which is the same boundary this list enforces, kept intact.
    - group: traefik.io
      kind: IngressRouteTCP
    # IMG-004 (2026-10-22): `Pod` and `ReplicaSet` added, namespaced only,
    # neither rendered by any chart in this project. ArgoCD's resource-tree
    # walk that populates `Application.status.summary.images` (Deployment →
    # ReplicaSet → Pod) only descends into kinds the project permits —
    # confirmed empirically: every Application in a project with an explicit
    # (non-wildcard) `namespaceResourceWhitelist` that omits these two kinds
    # has `status.summary.images` empty (all 5 `vcap` apps, plus
    # `adhigrahan-radar` in its own narrow project), while every Application
    # in the wildcard `apps` project (mochi, rankstack, upayan-v5, kirro,
    # status-page) has it populated. Without `status.summary.images`,
    # argocd-image-updater's liveness check always fails, forcing
    # `force-update: "true"` on every vcap image alias — which is the
    # precondition for the `images.auth.tag` oscillation bug documented in
    # IMG-002/IMG-003 on `vcap-backend-v1`.
    #
    # Security note, since this project was hardened after ESC-001/VCAP-002
    # (see the `clusterResourceWhitelist: []` comment above): this does not
    # reopen that escalation. Both kinds are namespaced only (no
    # `ClusterRole`/`ClusterRoleBinding`-class risk), and `apps/Deployment`
    # is already permitted here — a Deployment can already create a
    # ReplicaSet creating a Pod with an arbitrary spec, so whitelisting the
    # two descendant kinds directly grants no privilege beyond what
    # `Deployment` already does. No `ServiceAccount` with elevated RBAC is
    # granted by this change.
    - group: ""
      kind: Pod
    - group: apps
      kind: ReplicaSet
  orphanedResources:
    warn: true
