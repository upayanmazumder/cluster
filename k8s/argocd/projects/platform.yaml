apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: platform
  namespace: argocd
spec:
  description: Cluster-wide platform infrastructure
  sourceRepos:
    - https://github.com/upayanmazumder/cluster
    - https://argoproj.github.io/argo-helm
    - https://kedacore.github.io/charts
  # S11: destinations enumerated instead of `namespace: "*"`. An app that
  # needs a new namespace fails loudly ("namespace X is not permitted in
  # project platform") instead of silently deploying anywhere.
  # `namespace: ""` is required for priority-classes, which is cluster-scoped
  # only and therefore has no destination namespace.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ""
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # N7 (2026-09-29): the cluster-owned Postgres edge places objects in the *tenant* namespaces —
    # a `TLSOption` (the thing that accepts the ALPN name libpq 17+ offers; without it every modern
    # client's handshake fails with alert 120). The `vcap` project deliberately denies `TLSOption`
    # ("the tenant has no reason to touch routing"), so the object is cluster-owned and applied from
    # here instead.
    #
    # This widens an enumerated list, so, plainly, what it grants: an Application in THIS project may
    # target these two namespaces. Every app here is cluster-owned and lives in this repository, and
    # the tenant's own project is untouched — tenants still cannot create a `TLSOption`, alter it, or
    # point routing anywhere. The tidier long-term shape is a dedicated `cluster-edge` AppProject
    # owning exactly these destinations; that is a bigger change than the fix needs, and this note
    # exists so the next reader sees both options rather than re-deriving them.
    - server: https://kubernetes.default.svc
      namespace: vcap-dev
    - server: https://kubernetes.default.svc
      namespace: vcap-staging
    # V1-CUTOVER (2026-10-03): v1's namespace, for the same reason and nothing
    # else — the `vcap-pg` TLSOption that `vcap-v1`'s Postgres edge needs.
    # A TLSOption is namespaced and the `vcap` project deliberately denies the
    # kind, so it is cluster-owned and applied from here.
    - server: https://kubernetes.default.svc
      namespace: vcap-v1
  # S11: was `group: "*" / kind: "*"`. Now exactly the cluster-scoped kinds
  # the platform apps actually manage, taken from their live resource
  # inventories on 2026-09-28. Anything new must be added deliberately --
  # which is the point: this is the review gate for cluster-wide objects.
  # A missing kind fails visibly as a SyncFailed task on that app, it does
  # not silently mis-sync.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
