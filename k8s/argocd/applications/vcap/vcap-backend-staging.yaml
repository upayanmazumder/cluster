# vcap-backend-staging — api, worker, auth, postgres, redis, migrate hook.
# Chart source: VCAP-STAGING-BACKEND repo k8s/chart/
# Values: this VPS repo (secrets kept here, chart defaults in app repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcap-backend-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: https://github.com/vitscopesoftwareteam/VCAP-STAGING-BACKEND
    argocd-image-updater.argoproj.io/image-list: >-
      api=ghcr.io/vitscopesoftwareteam/vcap-staging-backend/api:latest,
      worker=ghcr.io/vitscopesoftwareteam/vcap-staging-backend/worker:latest,
      auth=ghcr.io/vitscopesoftwareteam/vcap-staging-backend/auth:latest
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/worker.update-strategy: digest
    argocd-image-updater.argoproj.io/auth.update-strategy: digest
    argocd-image-updater.argoproj.io/api.helm.image-name: images.api.repository
    argocd-image-updater.argoproj.io/api.helm.image-tag: images.api.tag
    argocd-image-updater.argoproj.io/worker.helm.image-name: images.worker.repository
    argocd-image-updater.argoproj.io/worker.helm.image-tag: images.worker.tag
    argocd-image-updater.argoproj.io/auth.helm.image-name: images.auth.repository
    argocd-image-updater.argoproj.io/auth.helm.image-tag: images.auth.tag
spec:
  project: vcap
  sources:
    - repoURL: https://github.com/vitscopesoftwareteam/VCAP-STAGING-BACKEND
      path: k8s/chart
      targetRevision: main
      helm:
        valueFiles:
          - $values/k8s/apps/vcap/values/backend-staging.yaml
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      ref: values
    # SEC-003: the Secrets the values file used to carry (backend-env, auth-env, pull-secret),
    # SOPS-encrypted and emitted by ksops. A separate source because this chart is Helm-sourced
    # from a git repository and `kustomize --enable-helm` cannot run a ksops generator alongside it
    # (docs/runbooks/rotate-secrets.md records that blocker). Same Application and the same Secret
    # names as before, so ArgoCD sees the same desired objects: nothing is pruned, no ownership moves.
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/vcap/secrets/staging
    # P1-04: the public Postgres edge, cluster-owned — see vcap-backend-dev.yaml
    # for the full note. vcap-staging carries class A data, so the P7-N7 port and
    # TLS change is additionally gated on the VCAP team's acceptance of the
    # pg_hba/non-superuser change (P2-08, OD-16). Until then this route serves
    # nothing: the tenant's NetworkPolicy admits same-namespace traffic only.
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/vcap/edge/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: vcap-staging
  syncPolicy:
    # V1-CUTOVER (2026-10-03): automated sync disabled to pause v2 while v1 is
    # deployed in its place. Deployments are scaled to 0 and the Ingress is
    # removed by hand; this stops ArgoCD selfHeal from reverting that. Data
    # (Postgres PV/PVC) is untouched and still protected by the Application's
    # own Delete=false,Prune=false annotation above. Revert: restore
    #   automated:
    #     prune: true
    #     selfHeal: true
    # then `kubectl scale --replicas=1 ...` and re-apply the v2 Ingress.
    # VCAP-007 (2026-09-29): the namespace is declared by the `storage`
    # Application now (k8s/platform/storage/namespaces-tenants.yaml), which
    # also enforces Pod Security `baseline` on it. ArgoCD therefore no longer
    # creates it and no longer owns its labels: two owners for one object is
    # how a namespace picks up a field nobody meant to set. The old
    # "S6 plans postgres.hostPort" note is gone with it — the chart never
    # rendered hostPort, and a `baseline` server-side dry-run on 2026-09-28
    # reported no violation for any VCAP workload.
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # S8: static PV binding, immutable fields — see vcap-backend-dev.yaml for
    # the full explanation; same fix, same reason.
    - kind: PersistentVolumeClaim
      name: vcap-backend-staging-data
      jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
