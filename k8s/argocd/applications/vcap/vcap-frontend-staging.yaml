# vcap-frontend-staging — Next.js web app at vcap.upayan.dev.
# Chart source: VCAP-STAGING-FRONTEND repo k8s/chart/
# Depends on vcap-backend-staging services being reachable in the same namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcap-frontend-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: https://github.com/vitscopesoftwareteam/VCAP-STAGING-FRONTEND
    argocd-image-updater.argoproj.io/image-list: >-
      web=ghcr.io/vitscopesoftwareteam/vcap-staging-frontend/web:latest
    argocd-image-updater.argoproj.io/web.update-strategy: digest
    argocd-image-updater.argoproj.io/web.helm.image-name: images.web.repository
    argocd-image-updater.argoproj.io/web.helm.image-tag: images.web.tag
spec:
  project: vcap
  sources:
    - repoURL: https://github.com/vitscopesoftwareteam/VCAP-STAGING-FRONTEND
      path: k8s/chart
      targetRevision: main
      helm:
        valueFiles:
          - $values/k8s/apps/vcap/values/frontend-staging.yaml
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      ref: values
    # S11 hardening: the frontend chart has no NetworkPolicy templates, so
    # the web pod's ingress policy lives in this repo and is applied by this
    # third source.
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/vcap/frontend-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: vcap-staging
  syncPolicy:
    # V1-CUTOVER (2026-10-03): automated sync disabled to pause v2 while v1 is
    # deployed in its place. Deployments are scaled to 0 and the Ingress is
    # removed by hand; this stops ArgoCD selfHeal from reverting that. Revert:
    # restore
    #   automated:
    #     prune: true
    #     selfHeal: true
    # then `kubectl scale --replicas=1 ...` and re-apply the v2 Ingress.
    # VCAP-007 (2026-09-29): the namespace is declared by the `storage`
    # Application now (k8s/platform/storage/namespaces-tenants.yaml), which
    # also enforces Pod Security `baseline` on it. ArgoCD therefore no longer
    # creates it and no longer owns its labels: two owners for one object is
    # how a namespace picks up a field nobody meant to set. The old
    # "S6 plans postgres.hostPort" note is gone with it — the chart never
    # rendered hostPort, and a `baseline` server-side dry-run on 2026-09-28
    # reported no violation for any VCAP workload.
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
