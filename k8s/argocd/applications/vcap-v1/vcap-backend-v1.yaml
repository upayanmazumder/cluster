# vcap-backend-v1 — v1 (devlabs fork) api + worker + auth + postgres + redis.
#
# The replacement for v2 (`vcap-backend-dev` / `vcap-backend-staging`), which
# are paused — deployments scaled to 0, Ingress removed, `syncPolicy.automated`
# stripped — but NOT deleted: their Applications, Services, Secrets, PVCs and
# Postgres data (static PVs on /srv/data/vcap-{dev,staging}) all stay in place
# so v2 can be brought back unchanged. See changelog/2026-10.md (V1-CUTOVER).
#
# Chart source: upayanmazumder-DevLabs/vcap-backend-v1 k8s/chart (the devlabs
# fork — never scopeapp2026, per the owner's standing instruction).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcap-backend-v1
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    # Image Updater tracks the two v1 backend images. The write-back commits
    # land in the DevLabs fork's main as `noodle <noodle@upayan.dev>`.
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: https://github.com/upayanmazumder-DevLabs/vcap-backend-v1
    # IMG-001 (2026-10-05): the tag is load-bearing. `update-strategy: digest`
    # REQUIRES a version constraint, and these entries originally named only the
    # repository — the updater rejected every one of them with
    #   cannot use update strategy 'digest' for image 'api=ghcr.io/...' without a version constraint
    # The two Applications that do work in this cluster both carry one
    # (rankstack `:edge`, v2's `:latest`), and v2's edge is the pattern this was
    # meant to copy; it was dropped when this file was written. `:latest` is the
    # mutable tag the fork's CI publishes.
    argocd-image-updater.argoproj.io/image-list: >-
      api=ghcr.io/upayanmazumder-devlabs/vcap-backend-v1:latest,
      worker=ghcr.io/upayanmazumder-devlabs/vcap-backend-v1:latest,
      auth=ghcr.io/upayanmazumder-devlabs/vcap-backend-v1-auth:latest
    # IMG-002 (2026-10-05): without these, every image is skipped with
    # "seems not to be live in this application". The liveness check reads
    # `status.summary.images`, which `GetImagesFromApplication` populates from
    # *currently running* images — and that field is empty for every VCAP
    # Application in this cluster (v2's included), so the check can never pass
    # here. `force-update` is the documented bypass for exactly this case
    # ("you may need to tell Image Updater to force the update despite no image
    # running"); it is what makes the digest write-back possible at all.
    argocd-image-updater.argoproj.io/api.force-update: "true"
    argocd-image-updater.argoproj.io/worker.force-update: "true"
    argocd-image-updater.argoproj.io/auth.force-update: "true"
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/worker.update-strategy: digest
    argocd-image-updater.argoproj.io/auth.update-strategy: digest
    argocd-image-updater.argoproj.io/api.helm.image-name: images.api.repository
    argocd-image-updater.argoproj.io/api.helm.image-tag: images.api.tag
    argocd-image-updater.argoproj.io/worker.helm.image-name: images.worker.repository
    argocd-image-updater.argoproj.io/worker.helm.image-tag: images.worker.tag
    argocd-image-updater.argoproj.io/auth.helm.image-name: images.auth.repository
    argocd-image-updater.argoproj.io/auth.helm.image-tag: images.auth.tag
spec:
  project: vcap
  sources:
    - repoURL: https://github.com/upayanmazumder-DevLabs/vcap-backend-v1
      path: k8s/chart
      targetRevision: main
      helm:
        releaseName: vcap-backend-v1
        valueFiles:
          - $values/k8s/apps/vcap-v1/values/backend-v1.yaml
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      ref: values
    # The backend-env / auth-env / pull-secret Secrets, SOPS-encrypted and
    # emitted by ksops — a separate source for the same reason the v2
    # Applications use one (a Helm-sourced chart and a ksops generator cannot
    # share a single kustomize build). Same mechanism, new namespace.
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/vcap-v1/secrets
    # V1-CUTOVER (2026-10-03): the public Postgres edge — the IngressRouteTCP
    # on the `vcap-pg-v1` entrypoint, its TLS material, and the additive
    # NetworkPolicy that admits Traefik (the tenant's own Postgres policy is
    # same-namespace only, by design). Same shape as v2's edge source.
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/vcap-v1/edge
  destination:
    server: https://kubernetes.default.svc
    namespace: vcap-v1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    # IMG-003 (2026-10-22): `images.auth.tag` oscillated between a resolved
    # GHCR digest and `""` (commits b84aa07/e93e006/589c6a6 and others, repo
    # upayanmazumder-DevLabs/vcap-backend-v1) whenever a routine GHCR
    # manifest fetch timed out. Root cause, confirmed from controller logs
    # (2026-10-22T12:01:02Z) and argocd-image-updater v0.17.0 source
    # (registry-scanner/pkg/registry/registry.go GetTags, pkg/argocd/update.go
    # UpdateApplication): with `force-update: "true"` set (IMG-002), a failed
    # per-tag manifest call yields an empty tag list; GetNewestVersionFromTags
    # falls back to returning the image's *current* tag; force-update replaces
    # that current tag with a blank dummy BEFORE the call, so the fallback
    # hands back the dummy and the updater writes "" as the new digest. One
    # poll cycle later (~2 min) the fetch succeeds and the digest is restored.
    # This never caused an outage: the chart's `vcap.image` helper falls back
    # to `Chart.AppVersion` (the mutable `:latest` tag) when `tag: ""`, so the
    # auth Deployment never got an invalid image ref — confirmed by the
    # `vcap-backend-v1-auth-*` pod showing 0 restarts across the incident.
    #
    # force-update exists only because IMG-002 found `status.summary.images`
    # empty for this Application. Tested whether `ApplyOutOfSyncOnly=true` —
    # the one syncOptions entry this Application has that rankstack/mochi/
    # upayan-v5 (which don't need force-update) don't — was the cause: PR
    # github.com/upayanmazumder/cluster#61 dropped it, merged, root/
    # vcap-backend-v1 both reconciled onto the new revision (confirmed live
    # `spec.syncPolicy.syncOptions` lost the entry), and
    # `status.summary.images` stayed `{}` through 3 forced hard refreshes
    # afterward. Hypothesis disproven — restored `ApplyOutOfSyncOnly=true`
    # here (PR #62) since dropping it had no benefit and only widens the
    # per-sync diff surface for no reason. The actual cause of the empty
    # `status.summary.images` for VCAP Applications specifically remains
    # unknown; ownership chains (Deployment→ReplicaSet→Pod) and resource
    # tracking method are identical to the working Applications, ruling out
    # the two next-likeliest causes. `force-update` stays.
    #
    # Not a fix candidate: upgrading argocd-image-updater past v0.17.0 — 
    # v1.0.0 removed annotation-based configuration entirely in favor of
    # ImageUpdater CRDs, so upgrading means migrating every annotation-based
    # Application in this cluster (10+ apps), not a scoped fix for this bug.
    #
    # Net: this is a self-healing, non-outage-causing upstream limitation in
    # the frozen annotation-based codepath (fixed upstream in
    # argocd-image-updater#1531, never released for the 0.x line). Accepted
    # as a known, low-impact, ~2-minute git-history blip rather than chased
    # further.
  ignoreDifferences:
    # KEDA writes /spec/replicas directly on the worker; the api HPA does the
    # same on its Deployment. Same exemption the v2 Applications carry.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # The Postgres PVC binds to the hand-provisioned static PV
    # (vcap-v1-postgres-data-vps) through a volumeName/storageClassName the
    # rendered chart cannot know — immutable once bound, so without this every
    # reconcile is a permanent OutOfSync. Same fix, same reason as v2's S8.
    - kind: PersistentVolumeClaim
      name: vcap-backend-v1-postgres-data
      jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
