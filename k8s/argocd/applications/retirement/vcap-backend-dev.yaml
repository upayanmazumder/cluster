apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcap-backend-dev
  namespace: argocd
spec:
  project: vcap
  source:
    repoURL: https://github.com/upayanmazumder/cluster
    targetRevision: main
    path: k8s/retired/vcap-backend-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: vcap-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
