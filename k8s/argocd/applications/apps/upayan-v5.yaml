# upayan-v5 — the Rust stats API behind api.upayan.dev (Spotify, Discord presence, signed PC
# reports, GitHub contributions, DevJourney proxy). The upayan.dev website itself runs on
# Vercel since v5.0.0 (2026-10-14), so this namespace holds only the API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: upayan-v5
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    # Digest tracking on the mutable `latest` tag that upayan.dev `main` publishes, same pattern
    # as status-page. write-back is git so the resolved digest lands in
    # k8s/apps/upayan-v5/kustomization.yaml.
    argocd-image-updater.argoproj.io/image-list: "api=ghcr.io/upayanmazumder/upayan.dev/api:latest"
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/api.kustomize.image-name: ghcr.io/upayanmazumder/upayan.dev/api
    argocd-image-updater.argoproj.io/write-back-method: "git:secret:argocd/git-creds-updater"
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: git@github.com:upayanmazumder/cluster.git
spec:
  project: apps
  source:
    repoURL: https://github.com/upayanmazumder/cluster
    targetRevision: main
    path: k8s/apps/upayan-v5
  destination:
    server: https://kubernetes.default.svc
    namespace: upayan-v5
  # No ignoreDifferences on /spec/replicas: the API no longer scales to zero. It keeps the latest
  # signed PC report and its provider caches in memory, so it runs one replica at all times.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
