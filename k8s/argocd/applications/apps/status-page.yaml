# status-page — explicit Application rather than a member of the `apps`
# ApplicationSet: it ships two images (api + app), and the set's template is
# deliberately single-image because a `{{- if }}` line is not valid YAML inside
# an ApplicationSet manifest. Same reason meghmitra (api + web) is explicit.
#
# Previously generated as `sg-status-page` by the `apps-sg` set; renamed and
# moved here in the de/sg consolidation (2026-09-28). The resources were
# carried over by orphaning them (the old Application's
# resources-finalizer.argocd.argoproj.io was removed before it was deleted), so
# nothing was recreated -- verified by PVC/pod UID.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status-page
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    # Digest tracking on the mutable `latest` tag, same pattern as the other
    # image-automated apps. write-back is git so the resolved digest lands in
    # k8s/apps/status-page/kustomization.yaml.
    argocd-image-updater.argoproj.io/image-list: "api=ghcr.io/upayanmazumder/status-page/api:latest,app=ghcr.io/upayanmazumder/status-page/app:latest"
    argocd-image-updater.argoproj.io/api.update-strategy: digest
    argocd-image-updater.argoproj.io/api.kustomize.image-name: ghcr.io/upayanmazumder/status-page/api
    argocd-image-updater.argoproj.io/app.update-strategy: digest
    argocd-image-updater.argoproj.io/app.kustomize.image-name: ghcr.io/upayanmazumder/status-page/app
    argocd-image-updater.argoproj.io/write-back-method: "git:secret:argocd/git-creds-updater"
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: git@github.com:upayanmazumder/cluster.git
spec:
  project: apps
  source:
    repoURL: https://github.com/upayanmazumder/cluster
    targetRevision: main
    path: k8s/apps/status-page
  destination:
    server: https://kubernetes.default.svc
    namespace: status-page
  ignoreDifferences:
    # Carried over from the ApplicationSet template it used to be generated by,
    # so adoption is a no-op. Nothing in this app scales on replicas today.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
