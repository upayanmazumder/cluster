# kirro — explicit Application rather than a member of the `apps` ApplicationSet: its manifests
# live in the app's own repo (github.com/Cheetos-gif/kirro, k8s/), not under k8s/apps/ in this
# repo, which the set's template cannot express (repoURL is hardcoded to this repo there).
#
# Image automation (2026-10-03): digest tracking on the mutable `latest` tag, same pattern as the
# rest of the cluster, with the resolved digest written back to **that repo's**
# k8s/kustomization.yaml -- the one ArgoCD actually renders. The write-back credential is
# `argocd/git-creds-noodle`, a deploy key scoped to Cheetos-gif/kirro alone; `git-creds-updater`
# cannot be reused because a deploy key is per-repository. `write-back-target` names the kustomize
# directory explicitly, since this Application has two sources and the updater would otherwise have
# to guess which one to write into.
#
# Before this, the pin could not live in git at all (the old note here explained why), so a new
# image needed `kubectl -n kirro rollout restart`; the digest write-back replaces that. The
# `latest` tag stays in the app repo's kustomization only as the pre-first-write-back fallback.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kirro
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd-image-updater.argoproj.io/image-list: "kirro=ghcr.io/cheetos-gif/kirro:latest"
    argocd-image-updater.argoproj.io/kirro.update-strategy: digest
    argocd-image-updater.argoproj.io/kirro.kustomize.image-name: ghcr.io/cheetos-gif/kirro
    argocd-image-updater.argoproj.io/write-back-method: "git:secret:argocd/git-creds-noodle"
    argocd-image-updater.argoproj.io/write-back-target: "kustomize:/k8s"
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: git@github.com:Cheetos-gif/kirro.git
spec:
  project: apps
  sources:
    # The app's own manifests: the mock, the LiveKit room server and the voice worker.
    - repoURL: https://github.com/Cheetos-gif/kirro
      targetRevision: main
      path: k8s
    # The voice channel's credentials. A second source because that repo is **public**, so its
    # Secret cannot be committed there; this directory is in this private repo and SOPS-encrypted
    # through ksops. Same shape and same reasoning as the vcap Secrets (SEC-003).
    - repoURL: https://github.com/upayanmazumder/cluster
      targetRevision: main
      path: k8s/apps/kirro/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kirro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
