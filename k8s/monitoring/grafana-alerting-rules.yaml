      summary: 'More than 10 failed ArgoCD logins in 10m — credential guessing against the cluster control plane. The admin account is `admin`, and Cloudflare Access (N3) should be in front of this host.'

  # --- "I cannot see the metric at all" -----------------------------------------------------------
  #
  # Companions to the staleness rules above, and the other half of the fix for the defect recorded in
  # changelog/2026-09.md (2026-09-29, 21:45 IST): 18 of 24 rules fired permanently because a threshold
  # expression is a *filter* — healthy means no series, Grafana calls that NoData, and `noDataState:
  # Alerting` turned it into firing. The staleness rules deliberately carried `Alerting` to cover a
  # second, real case ("the metric vanished, so the job is not running"), and that case is what these
  # rules take over, so nothing is lost by the flip.
  #
  # `absent(x)` is the inverse shape: it returns a series (value 1) exactly when `x` is missing, and
  # nothing when it is present. So the healthy state HAS data and `noDataState: OK` is correct for
  # these too — the two rule shapes now agree instead of contradicting.
  #
  # Overlap with `prometheus-target-down` (`up == 0`) is deliberate: that rule catches node-exporter
  # being down, these catch the textfile metric being gone while node-exporter is up — a fresh node
  # after a rebuild where no backup has run yet, or a deleted .prom file. `for:` is generous for
  # exactly that reason: a rebuild should not page before the first timer has had a chance to fire.
  #
  # `vps_backup_offsite_last_success_timestamp` deliberately has NO rule here — see the note on
  # `vps-backup-offsite-stale` above.
  - uid: vps-backup-classa-absent
    title: VPS backup (class A) metric is missing entirely
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: absent(vps_backup_last_success_timestamp{class="A"})
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 30m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'No `vps_backup_last_success_timestamp{class="A"}` series exists at all — no class-A backup has succeeded since the textfile collector was last populated, so the vcap-staging Postgres+MinIO data is unprotected. On a rebuilt node this is expected until the first run; otherwise check `systemctl status vps-backup-classA` and that /var/lib/node_exporter/textfile_collector/vps_backup_class_A.prom exists.'
  - uid: vps-backup-classc-absent
