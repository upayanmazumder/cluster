  - uid: vps-backup-classa-stale
    title: VPS backup (class A) has not succeeded in over an hour
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (time() - vps_backup_last_success_timestamp{class="A"}) > 2700
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 10m
    # `NoData: OK`, and the "a vanished series means backups are not running" case is NOT lost — it
    # moved to its own `absent()` rule at the bottom of this file. Folding the two into one
    # condition is what made this rule fire permanently: the expression is a *filter*, so a healthy
    # backup produces no series, which Grafana reports as NoData, which `Alerting` turned into
    # firing. Separated, each half says one thing: this rule means "the last success is too old",
    # the `absent()` rule means "I cannot see the metric at all".
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'No successful class-A backup (vcap-staging Postgres+MinIO) for over 45 minutes (three missed 15-minute runs); Check `systemctl status vps-backup-classA` and `journalctl -u vps-backup-classA` on the node.'
  - uid: vps-backup-classc-stale
    title: VPS backup (class C) has not succeeded in over 36 hours
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (time() - vps_backup_last_success_timestamp{class="C"}) > 93600
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 10m
    # `NoData: OK`, and the "a vanished series means backups are not running" case is NOT lost — it
    # moved to its own `absent()` rule at the bottom of this file. Folding the two into one
    # condition is what made this rule fire permanently: the expression is a *filter*, so a healthy
    # backup produces no series, which Grafana reports as NoData, which `Alerting` turned into
    # firing. Separated, each half says one thing: this rule means "the last success is too old",
    # the `absent()` rule means "I cannot see the metric at all".
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: 'No successful class-C backup (bitvault, vcap-dev, rankstack, grafana) in 26h; the timer runs daily. Check `systemctl status vps-backup-classC` on the node.'
  - uid: vps-restic-check-stale
