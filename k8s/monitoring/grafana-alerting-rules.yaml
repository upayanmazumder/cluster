  # --- N8 (P7): authentication-failure visibility ------------------------------------------------
  #
  # These two are the plan's N8 pair. They are log-based on purpose: an auth failure leaves no metric
  # behind — the only record of "someone tried the superuser over the network and was refused" is the
  # server's own log line, and the same is true of a password guessing run against ArgoCD.
  #
  # State of each, stated because a provisioned alert that has never fired is not evidence. Neither
  # has been exercised, and the reason is an observability defect rather than the rules:
  #   - `argocd-login-failures` WAS exercised the day it was added — three deliberate wrong-password
  #     logins against `argocd.upayan.dev` (`Invalid username or password` in the CLI was confirmed),
  #     and then the rule's exact LogQL was run straight against Loki. It returned **zero series**.
  #     Loki's own querier log for that query is the evidence that this is not the rule:
  #     `status=200 returned_lines=0 store_chunks_download_time=0s chunk_refs_fetch_time=425µs` — the
  #     **store returned no chunk references at all**, and `table_manager` reports
  #     `distinct_users_len=0`. Meanwhile the write path is healthy
  #     (`loki_distributor_bytes_received_total{tenant="fake"} = 522 MB`, 4804 chunks created,
  #     12 020 files under `/loki/chunks`). So Loki accepts writes and reads back nothing, for *any*
  #     selector, at *any* range — which means the VCAP log dashboards are inert too.
  #   - `vcap-postgres-auth-failures` cannot be exercised for a second reason on top of that, and the
  #     state moved on 2026-09-29 (N7): the edge now EXISTS — Traefik listens on 15432/15433, the two
  #     `IngressRouteTCP`s carry TLS, and an additive NetworkPolicy admits Traefik to tcp/5432 on the
  #     Postgres pods (so "the tenant NetworkPolicy admits same-namespace traffic only" is no longer
  #     the whole story). What keeps it unexercised is the **firewall**: no rule exists for 15432/15433,
  #     verified unreachable from an ordinary host, so no external client can attempt authentication.
  #     An in-cluster or tailnet client could now reach the edge over TLS and fail a login; nothing does.
  #     It is authored so the coverage exists on the day the firewall rule is added (N7's last step).
  #
  # Still missing, and deliberately recorded rather than hand-written here: the plan's P2-08 table also
  # asks for a **Traefik TCP connection-rate panel**. It does not exist yet — none of the
  # `dashboard-*.json` files carry a Traefik panel — and it belongs with P2-08, which is blocked on
  # VCAP's acceptance, not bolted on now merely so a table looks complete.
  #
  # **Do not read a clean alert list as coverage.** Both rules are correctly shaped and neither has
  # observed a single event. Fixing Loki's read path is its own task and is NOT part of this
  # migration; it is recorded in the changelog for the same day.
  - uid: vcap-postgres-auth-failures
    title: VCAP Postgres authentication failures
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: loki
        model:
          editorMode: code
          expr: sum by (namespace) (count_over_time({namespace=~"vcap-.*",container="postgres"} |~ "password authentication failed|no pg_hba.conf entry|pg_hba.conf rejects" [10m]))
          queryType: instant
          refId: A
      - refId: B
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          type: reduce
          expression: A
          reducer: last
          settings:
            mode: dropNN
          refId: B
      - refId: C
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: __expr__
        model:
          type: threshold
          expression: B
          conditions:
            - evaluator:
                type: gt
                params:
                  - 50
              operator:
                type: and
              query:
                params:
                  - C
              reducer:
                type: last
                params: []
          refId: C
    for: 10m
    # `OK`, not `Alerting`: before P7-N7 there is no postgres traffic at all, so "no log lines" is the
    # expected state and must not read as a failure. After the port opens, `NoData` would be the
    # interesting signal — that change belongs with N7, not here.
    noDataState: OK
    execErrState: Error
    labels:
      # Alerting, not warning: on a public Postgres port this is either a misconfigured app or someone
      # guessing credentials, and #N7's whole design assumes pg_hba is what stops them.
      severity: critical
    annotations:
      summary: 'More than 50 Postgres authentication failures in 10m in vcap-{{ $labels.namespace }} — a client is misconfigured, or credentials are being guessed. Check `pg_hba` is still rejecting the superuser over the network (P2-08) and review the source addresses in the log.'
  - uid: argocd-login-failures
    title: ArgoCD login failures
    condition: C
    data:
      - refId: A
        relativeTimeRange:
          from: 600
          to: 0
        datasourceUid: loki
