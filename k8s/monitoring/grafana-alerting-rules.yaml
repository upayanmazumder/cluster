  - uid: tls-cert-expiring
    title: TLS certificate expiring within 60 days
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        # CLEAN-002 (2026-09-28). This rule used to watch
        # `certmanager_certificate_expiration_timestamp_seconds` — but cert-manager was removed on
        # 2026-09-28, so it was watching a metric that no longer exists, while the certificate
        # actually in use expired in ONE year rather than the 2041 the documentation claimed. The
        # requirement it now serves is concrete: the Origin CA wildcard the origin serves expires
        # 2027-09-28 and nothing renews it automatically.
        #
        # `traefik_tls_certs_not_after` is the expiry of the certificate Traefik has *loaded*, i.e.
        # what it serves — the thing that actually matters, rather than what some controller intended.
        #
        # `min by (sans)` is deliberate, for two different reasons:
        #   1. Traefik exports one series per loaded certificate *and* the pod is scraped twice
        #      (`job=traefik` and `job=kubernetes-pods`), so this dedupes duplicates;
        #   2. it selects the SOONEST expiry per SAN set. Taking the maximum, or matching one series,
        #      would report a long-dated certificate and miss a near one — which is precisely what
        #      happens while Traefik still holds a superseded leaf: its certificate store is additive,
        #      so a rotation needs a Traefik restart to drop the old certificate (see
        #      `docs/runbooks/rotate-certificates.md`). Verified against live Prometheus on
        #      2026-09-28, when it correctly returned 364.8 days and ignored a stale 2041 entry.
        expr: (min by (sans) (traefik_tls_certs_not_after) - time()) / 86400 < 60
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
        refId: C
    for: 1h
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: 'TLS certificate for [{{ $labels.sans }}] expires in under 60 days — renew the Cloudflare Origin CA certificate: docs/runbooks/rotate-certificates.md'
