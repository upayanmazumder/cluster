apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    positions:
      filename: /tmp/positions.yaml

    scrape_configs:
    - job_name: kubernetes-pods
      static_configs:
        - targets: [localhost]
          labels:
            __path__: /var/log/containers/*.log
      pipeline_stages:
        # Parse CRI log format (timestamp, stream-type, flags, message)
        - cri: {}
        # filename stream label = /var/log/containers/<pod>_<namespace>_<container>-<64hex>.log
        # pipeline regex 'source' reads extracted values, not stream labels; use
        # index function to copy filename stream label into extracted values first.
        - template:
            source: _path
            template: '{{ index .Labels "filename" }}'
        - regex:
            source: _path
            expression: '/var/log/containers/(?P<pod>[^_]+)_(?P<namespace>[^_]+)_(?P<container>.+)-[0-9a-f]{64}\.log$'
        - labels:
            namespace:
            pod:
            container:
