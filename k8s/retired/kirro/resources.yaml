apiVersion: v1
kind: Namespace
metadata:
  name: kirro
  annotations:
    argocd.argoproj.io/sync-options: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kirro-mock-data
  namespace: kirro
  annotations:
    argocd.argoproj.io/sync-options: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kirro-voice-logs
  namespace: kirro
  annotations:
    argocd.argoproj.io/sync-options: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
