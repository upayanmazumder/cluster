apiVersion: v1
kind: Namespace
metadata:
  name: rankstack
  annotations:
    argocd.argoproj.io/sync-options: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rankstack-mongo-pvc
  namespace: rankstack
  annotations:
    argocd.argoproj.io/sync-options: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
