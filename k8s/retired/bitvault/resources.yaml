apiVersion: v1
kind: Namespace
metadata:
  name: bitvault
  annotations:
    argocd.argoproj.io/sync-options: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitvault-minio-pvc
  namespace: bitvault
  annotations:
    argocd.argoproj.io/sync-options: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitvault-postgres-pvc
  namespace: bitvault
  annotations:
    argocd.argoproj.io/sync-options: ""
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
