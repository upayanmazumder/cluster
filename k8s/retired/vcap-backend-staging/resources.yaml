apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vcap-backend-staging-data
  namespace: vcap-staging
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: vcap-backend-staging-data-vps
