# Git-tracked registry of what vps-backup.sh dumps before handing off to restic.
# Source: docs/storage.md (per-dataset table) + docs/plans/2026-09-27-architecture-review.md §12.
#
# class: A (every 30 min, long retention) | C (daily, short retention, best-effort)
# engine: postgres | mongo | file (restic reads the path directly, no dump step)
#
# Every `path:` below was checked against the live host on 2026-10-23. A wrong path does not fail
# loudly: restic reports the missing path and the rest of the snapshot looks fine. A missing
# `postgres` or `mongo` workload fails that target and the whole class run. Re-check after any
# storage move.

- namespace: vcap-staging
  workload: vcap-backend-staging-data
  engine: file
  path: /srv/data/vcap-staging # retired 2026-10-23: Postgres and MinIO workloads are gone.
       # The PVC data is static. restic backs up the raw Postgres data dir plus MinIO files.
       # Class A still covers this dataset. Use a temporary Postgres pod on a copy to make a
       # logical dump before you start any process that writes to the data dir.
  class: A

# Gitorgasm production Postgres (k8s/apps/gitorgasm). Logical dump. The
# data dir is a static Retain PV on /srv/data/gitorgasm-postgres.
- namespace: gitorgasm
  workload: postgres
  engine: postgres
  class: A

- namespace: vcap-dev
  workload: vcap-backend-dev-data
  engine: file
  path: /srv/data/vcap-dev # retired 2026-10-23: Postgres and MinIO workloads are gone.
       # The PVC data is now static. Back up the raw files. See the vcap-staging note above.
  class: C

# vcap v1 was retired on 2026-10-27. No workload runs, so a logical dump is impossible. The
# Postgres 16 data dir is a static Retain PV, stopped cleanly before the retirement. restic reads
# the raw tree. To get a logical dump, start a temporary Postgres 16 pod on a COPY of this tree.
- namespace: vcap-v1
  workload: vcap-backend-v1-postgres
  engine: file
  path: /srv/data/vcap-v1-postgres
  class: C

# vcap v1 application data: uploaded documents and API-generated files. The PVC uses local-path.
# The PV reclaim policy was changed from `Delete` to `Retain` on 2026-10-27. The tree is static,
# and restic reads it directly.
- namespace: vcap-v1
  workload: vcap-backend-v1-data
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-d4b91391-4691-43c4-9590-6bbe1ddf0ad9_vcap-v1_vcap-backend-v1-data
  class: C

# Final logical dump of the vcap v1 database, taken on 2026-10-27 with `pg_dumpall` just before the
# Postgres workload was stopped. It restores without a Postgres 16 data directory. See
# docs/runbooks/restore-postgres.md.
- namespace: vcap-v1
  workload: vcap-v1-final-dump
  engine: file
  path: /srv/data/vcap-v1-final-dump
  class: C

# Adhigrahan Radar replaced the application that ran on the meghmitra hostnames. Its SQLite store
# is at /srv/data/adhigrahan-radar-data. The old meghmitra target pointed at /srv/data/meghmitra-data,
# which does not exist. That path is the PV's configured path, but the directory was never created.
# The live Adhigrahan tree contains `vivaad.db`, `models/`, and `fallback/`.
# `sqlite:` takes a consistent copy of the one file that is being written while restic reads it.
- namespace: adhigrahan-radar
  workload: adhigrahan-radar-api
  engine: file
  path: /srv/data/adhigrahan-radar-data
  class: C
  sqlite: vivaad.db

# meghmitra-postgres was removed from this registry on 2026-09-29 because its Deployment had been
# pruned and the target failed every class-A run. The workload is still retired, but the raw data
# remains on `vps-data` and is recoverable with a temporary pod. Back it up as static files.
- namespace: meghmitra
  workload: meghmitra-postgres
  engine: file
  path: /srv/data/meghmitra-postgres
  class: C

- namespace: bitvault
  workload: bitvault-postgres
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-4f59ae33-a946-42a4-bb05-0c0bd458e454_bitvault_bitvault-postgres-pvc # retired 2026-10-23: raw, static Postgres data
  class: C

- namespace: bitvault
  workload: bitvault-minio
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-acbed98f-94ef-414e-a6bf-ad69882db2d7_bitvault_bitvault-minio-pvc
  class: C

- namespace: rankstack
  workload: rankstack-mongo
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-fb2fad5e-3e23-46cb-af88-659ecee047f6_rankstack_rankstack-mongo-pvc # retired 2026-10-23: raw, static Mongo data
  class: C

# kirro was retired on 2026-10-23. Both PVCs use local-path with `Delete`, so a PVC deletion loses
# the data. The workloads are gone, so back up the static trees directly.
- namespace: kirro
  workload: kirro-mock-data
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-623ce531-383b-4960-aadd-9d0310bbe7a5_kirro_kirro-mock-data
  class: C

- namespace: kirro
  workload: kirro-voice-logs
  engine: file
  path: /var/lib/rancher/k3s/storage/pvc-905a8d2c-d782-4384-9bc2-aff3941590df_kirro_kirro-voice-logs
  class: C

# hello-kitty (retired 2026-09-28) was removed here by CLEAN-002. Its PV is `Released` and the
# directory below it belongs to an app that no longer runs — a target that backs up nothing while
# looking like coverage, which is the failure mode this registry's header warns about.

- namespace: monitoring
  workload: grafana
  engine: file
  path: /var/lib/k8s-monitoring/grafana
  class: C
  # `sqlite:` makes the backup script take a consistent copy with `sqlite3 .backup` into the staging
  # dir first. restic then reads that copy, not a file Grafana may be mid-write on.
  sqlite: grafana.db
