---
# P4-03 (2026-09-29): the volume device is a Terraform output, not a repo constant. On any rebuild
# the `vps-data` volume gets a NEW id (and therefore a new /dev/disk/by-id path), so the
# authoritative value comes from the owning checkout:
#
#   cd ~/dev/upayanmazumder/cluster && scripts/tf.sh output -raw data_volume_vps_linux_device
#
# and is passed to this play as:
#
#   ansible-playbook site.yml -e data_volume_vps_linux_device=/dev/disk/by-id/scsi-0HC_Volume_<id>
#
# The default below is the *live* volume's device as it exists today (verified on the node
# 2026-09-29: `readlink -f /dev/disk/by-id/scsi-0HC_Volume_106969476` -> ../../sdd, mounted at
# /srv/data). It keeps a `-e`-less `--check` run and any non-rebuild maintenance run working; a
# rebuild MUST pass `-e`, because the fallback names a volume that no longer exists and the role
# fails loudly on a missing device rather than mounting the wrong one.
data_volume_vps_linux_device: /dev/disk/by-id/scsi-0HC_Volume_106969476
data_volume_device: "{{ data_volume_vps_linux_device }}"
data_volume_mount_path: /srv/data

# Directories under the mount that a workload needs to pre-exist, with the ownership that workload
# runs as. These are `hostPath` PVs' backing directories: a hostPath volume inherits the host's
# ownership (the kubelet does not chown it), and `type: Directory` refuses to mount a path that does
# not exist — so both the existence and the ownership are host configuration, i.e. this role's job.
#
# Adhigrahan Radar (P3-M2) is the first: its API runs as UID/GID 10001 (its own `Dockerfile.api`)
# and writes one AuditLog row per request, so an unwritable directory is a 500 on every request
# rather than a log line. The PV that mounts it is `meghmitra-data-pvc-vps` in
# `k8s/platform/storage/persistentvolumes.yaml`.
#
# Deliberately not the VCAP data directories: those are owned by the Postgres image's own UID and
# were created when their volumes were, so declaring them here would rewrite ownership this role
# does not own.
data_volume_tenant_dirs:
  - path: /srv/data/meghmitra-data
    owner: "10001"
    group: "10001"
    mode: "0750"
  - path: /srv/data/batch-autopsy-postgres
    owner: "70"
    group: "70"
    mode: "0700"
