# Port registry for the `vps` cluster (Hetzner DE, 138.201.157.147).
#
# Source of truth for every port that is (or was, or will be) reachable from outside the pod
# network. Cross-checked by `scripts/check-ports.py`, which fails CI if:
#   - two entries share the same (port, proto, scope), or
#   - a NodePort/LoadBalancer Service or hostPort in k8s/ has no matching entry here.
#
# `status` values (validated by scripts/check-ports.py — an unknown value is an error, because the
# checks branch on this field and a typo used to make an entry silently invisible to all of them):
#   live    — reachable today
#   open    — reachable today, deliberately and recently opened (the N7 Postgres edge)
#   remove  — reachable today, scheduled for removal (duplicate/unmanaged path)
#   target  — NOT reachable; the intended future state
#   closed  — NOT reachable; the listener exists but nothing can get to it
#   removed — NOT reachable; the path itself is gone
#
# The first three assert "the internet can reach this today", and scripts/check-ports.py requires
# each of them to have a matching inbound rule in terraform/firewall.tf — and every rule there to
# have one of them here. The Hetzner Cloud Firewall is an allow-list, so "a rule exists" and "it is
# reachable" are one statement; before 2026-09-30 nothing compared the two files and they had
# drifted in both directions.
#
# `scope`: internal (pod/cluster network only) | tailnet (Tailscale-only) | public (open internet)
#
# Last verified live: 2026-09-27 (ss -Hltnp on the node + external TCP probe from workstation).
# Reconciled against terraform/firewall.tf on 2026-09-30 — see the `status` notes below. That
# reconciliation is a *documentary* one: it is sound because the firewall is an allow-list and
# Terraform is the only thing that writes it, but the rows it changed from `remove` to `closed`
# (2379, 2380, 8472, 9100, 10250, 30843, 30851) have not been re-probed from outside since
# 2026-09-27. A fresh external scan is the cheap way to confirm it.
# See docs/ports.md for the human-readable render and docs/networking.md for the firewall layers.

- port: 22
  proto: tcp
  service: sshd
  k8s_service: null
  namespace: null
  owner: upayan
  scope: public
  status: remove
  reason: "key-only root SSH; target state moves admin access to Tailscale only (S3/S6)"
  firewall_rule: "tcp 22 from 0.0.0.0/0 and ::/0 — **applied**. The parenthetical here used to read 'no Hetzner Cloud Firewall exists yet', which stopped being true on 2026-09-28. The firewall exists and deliberately allows 22 from anywhere; `status: remove` is still correct because closing it is N5, gated on a proven tailnet path from every admin machine."
  ingress: direct
  auth: ssh key (root only)
  temporary: false
  expires: null

